name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$version"; then
            echo "Release tag must use vMAJOR.MINOR.PATCH, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if ! grep -Fq "## $version " CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build, test, and verify release archive
        run: make release VERSION="${{ steps.version.outputs.value }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          archive="release/conductor-v${VERSION}.zip"
          checksum="${archive}.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --verify-tag \
              --title "Conductor ${VERSION}" \
              --generate-notes
          fi
