name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - name: Formatting
        run: make fmt-check
      - name: Tests
        run: make test
      - name: Vet
        run: make vet
      - name: Race detector
        run: make race
      - name: Build and verify macOS release archive
        run: make verify-package
      - uses: actions/upload-artifact@v7
        with:
          name: conductor-release
          path: |
            release/conductor-v*.zip
            release/conductor-v*.zip.sha256
          if-no-files-found: error
